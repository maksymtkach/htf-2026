services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guardians
      POSTGRES_PASSWORD: guardians
      POSTGRES_DB: guardians
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgres://guardians:guardians@db:5432/guardians

    depends_on:
      - db
    command: sh -c "npm run db:push && npm run db:seed && npm run dev"

volumes:
  db_data:
